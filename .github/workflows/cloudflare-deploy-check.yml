# After each push to main, wait for the Cloudflare build and confirm that
# https://fellowsurvivor.com serves the pushed files. A failure here makes GitHub
# send its usual "workflow run failed" notification.
name: Cloudflare deploy check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: cloudflare-deploy-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the Cloudflare build and compare the live site
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-cloudflare-deploy.sh fellowsurvivor-reel-nest
